; PlatformIO project configuration
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-devkitm-1]
; Verze zamerne pripnute - nepripnuta platforma/knihovna se muze kdykoli
; zmenit a rozbit build. Pri upgradu menit vedome a otestovat na HW.
platform = espressif32@^6.9.0
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    adafruit/Adafruit GFX Library@^1.12.6
    adafruit/Adafruit BusIO@^1.17.4
    adafruit/Adafruit SHARP Memory Display@^1.1.4
    olikraus/U8g2_for_Adafruit_GFX@1.8.0
    knolleary/PubSubClient@^2.8
    sensirion/Sensirion I2C SEN66@^1.3.1
    sensirion/Sensirion Core@^0.7.3
    bblanchon/ArduinoJson@^7.4.2

build_flags =
    -DCORE_DEBUG_LEVEL=3
